        role: "Agronomy Specialist & Farm Director",

      }
    ];

    const INITIAL_FIELDS = [
      {

        live: { moisture: 38, tempC: 32.0, humidity: 58, rainSensor: false, pumpOn: true, pumpRunSeconds: 380, lastSeen: Date.now() - 15000, status: "ON", reason: "Manual override active: Running" }
      },

        live: { moisture: 54, tempC: 28.5, humidity: 72, rainSensor: false, pumpOn: false, pumpRunSeconds: 0, lastSeen: Date.now() - 40000, status: "OFF", reason: "Moisture adequate: pump idle" }
      }
    ];

    const getCropDefaults = (crop, soil) => {
      const base = {
        paddy: { lowT: 60, highT: 85 },
        wheat: { lowT: 35, highT: 60 },
        sugarcane: { lowT: 50, highT: 75 },
        cotton: { lowT: 30, highT: 55 },
        vegetables: { lowT: 45, highT: 70 },
        maize: { lowT: 40, highT: 65 },
        custom: { lowT: 40, highT: 65 }
      };
      let t = base[crop] || base.custom;
      if (soil === 'clay') return { lowT: t.lowT + 5, highT: Math.min(t.highT + 5, 95) };
      if (soil === 'sandy') return { lowT: Math.max(t.lowT - 5, 20), highT: t.highT - 5 };
      return t;
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState("home");
      const [currentUser, setCurrentUser] = useState(DEMO_USERS[0]);
      const [fields, setFields] = useState(INITIAL_FIELDS);
      const [activeFieldId, setActiveFieldId] = useState(INITIAL_FIELDS[0].id);
      const [selectedField, setSelectedField] = useState(null);
      const [simulatedRain, setSimulatedRain] = useState(false);
      const [isAlertsOpen, setIsAlertsOpen] = useState(false);
      const [manualTimerMinutes, setManualTimerMinutes] = useState(15);
      const [manualTimerSecondsLeft, setManualTimerSecondsLeft] = useState(null);

      // Add Field Form State
      const [newFieldName, setNewFieldName] = useState("");
      const [newCrop, setNewCrop] = useState("paddy");
      const [newSoil, setNewSoil] = useState("clay");
      const [newAreaAcres, setNewAreaAcres] = useState(1.5);
      const [newMethod, setNewMethod] = useState("drip");
      const [newLowT, setNewLowT] = useState(60);
      const [newHighT, setNewHighT] = useState(85);
      const [newRainBlock, setNewRainBlock] = useState(60);
      const [newFlowRate, setNewFlowRate] = useState(32.4);
      const [newLat, setNewLat] = useState(20.2961);
      const [newLng, setNewLng] = useState(85.8245);
      const [fieldAddedMessage, setFieldAddedMessage] = useState(null);

      // Auth View State
      const [authMode, setAuthMode] = useState("login");
      const [authEmail, setAuthEmail] = useState("ramesh@agrica.org");
      const [authPassword, setAuthPassword] = useState("password123");
      const [authName, setAuthName] = useState("");
      const [authFarmLocation, setAuthFarmLocation] = useState("Odisha Agro-Zone 4");

      // Weather View State
      const [weatherCity, setWeatherCity] = useState("Bhubaneswar");
      const [weather, setWeather] = useState({
        name: "Bhubaneswar, Odisha",
        temp: 31.8,
        humidity: 68,
        wind: 14,
        pressure: 1011,
        desc: "CLEAR SKY & MODERATE HUMIDITY",
        rainProb: 15,
        isRain: false
      });

      // Contact Form State
      const [contactSubmitted, setContactSubmitted] = useState(false);

      // Terminal logs
      const [terminalLogs, setTerminalLogs] = useState([
        { time: "01:30:12", msg: "LoRa Mesh Gateway initialized on 868.1 MHz.", highlight: false },
        { time: "01:31:05", msg: "Field 1 ADC reading: 2410 (Moisture: 42%). Target low: 60%.", highlight: false },
        { time: "01:32:00", msg: "Telemetry nominal: 3 plot probes online. Battery: 4.12V (Solar OK).", highlight: false }
      ]);

      const currentField = fields.find(f => f.id === activeFieldId) || fields[0];

      // Physical Simulation Loop (ticks every 3 seconds)
      useEffect(() => {
        const interval = setInterval(() => {
          setFields(prev => prev.map(f => {
            let m = f.live.moisture;
            let pump = f.live.pumpOn;
            let runSec = f.live.pumpRunSeconds;
            let reason = f.live.reason;
            let status = f.live.status;

            if (pump) {
              m = Math.min(95, m + 2);
              runSec += 3;
            } else {
              m = Math.max(10, m - 0.5);
              runSec = 0;
            }

            if (simulatedRain) {
              m = Math.min(95, m + 3);
              if (pump) {
                pump = false;
                status = "BLOCKED BY RAIN";
                reason = "Precipitation lockout triggered (safety stop)";
              }
            } else if (f.config.mode === "AUTO") {
              if (m < f.config.lowT && !pump) {
                pump = true;
                status = "ON";
                reason = `Moisture ${m}% < threshold ${f.config.lowT}%. Auto ON.`;
              } else if (m >= f.config.highT && pump) {
                pump = false;
                status = "OFF";
                reason = `Moisture reached upper limit ${f.config.highT}%. Auto OFF.`;
              } else if (pump) {
                status = "ON";
                reason = `Irrigating: ${m}% -> ${f.config.highT}%`;
              } else {
                status = "OFF";
                reason = "Moisture within normal limits";
              }
            }

            return {
              ...f,
              live: {
                ...f.live,
                moisture: Math.round(m),
                pumpOn: pump,
                pumpRunSeconds: runSec,
                status: pump ? "ON" : (simulatedRain ? "BLOCKED BY RAIN" : "OFF"),
                reason,
                lastSeen: Date.now()
              }
            };
          }));
        }, 3000);

        return () => clearInterval(interval);
      }, [simulatedRain]);

      // Manual Run Countdown Timer
      useEffect(() => {
        let timer;
        if (manualTimerSecondsLeft !== null && manualTimerSecondsLeft > 0) {
          timer = setInterval(() => {
            setManualTimerSecondsLeft(sec => {
              if (sec <= 1) {
                setFields(fs => fs.map(f => f.id === currentField.id ? { ...f, live: { ...f.live, pumpOn: false, status: "OFF", reason: "Manual timer completed" } } : f));
                const tStr = new Date().toTimeString().split(" ")[0];
                setTerminalLogs(l => [{ time: tStr, msg: `Manual timer elapsed. Pump relay OFF.`, highlight: true }, ...l.slice(0, 20)]);
                return null;
              }
              return sec - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [manualTimerSecondsLeft, currentField.id]);

      const handleModeChange = (fieldId, newMode) => {
        setFields(fs => fs.map(f => {
          if (f.id === fieldId) {
            const updated = { ...f, config: { ...f.config, mode: newMode } };
            const timeStr = new Date().toTimeString().split(" ")[0];
            setTerminalLogs(logs => [
              { time: timeStr, msg: `Mode switched to ${newMode} for ${f.name}.`, highlight: true },
              ...logs.slice(0, 20)
            ]);
            return updated;
          }
          return f;
        }));
      };

      const toggleManualPump = (field) => {
        setFields(prev => prev.map(f => {
          if (f.id === field.id) {
            const willTurnOn = !f.live.pumpOn;
            const timeStr = new Date().toTimeString().split(" ")[0];
            setTerminalLogs(logs => [
              { time: timeStr, msg: willTurnOn ? `MANUAL OVERRIDE: Pump relay ENERGIZED (${f.flowRateLpm || 32.4} L/min).` : "MANUAL OVERRIDE: Pump relay DE-ENERGIZED.", highlight: true },
              ...logs.slice(0, 20)
            ]);
            return {
              ...f,
              live: {
                ...f.live,
                pumpOn: willTurnOn,
                status: willTurnOn ? "ON" : "OFF",
                reason: willTurnOn ? "Manual operator override: Pump ON" : "Manual operator override: Pump stopped",
                pumpRunSeconds: 0
              }
            };
          }
          return f;
        }));
      };

      const startTimedRun = (minutes) => {
        setManualTimerSecondsLeft(minutes * 60);
        setFields(prev => prev.map(f => {
          if (f.id === currentField.id) {
            return {
              ...f,
              live: {
                ...f.live,
                pumpOn: true,
                status: "ON",
                reason: `Manual timer running (${minutes} min)`
              }
            };
          }
          return f;
        }));
        const tStr = new Date().toTimeString().split(" ")[0];
        setTerminalLogs(l => [{ time: tStr, msg: `Timer started: ${minutes} min irrigation run scheduled.`, highlight: true }, ...l.slice(0, 20)]);
      };

        const cropLabels = {
          paddy: "Paddy (Rice)",
          wheat: "Wheat HD-2967",
          sugarcane: "Sugarcane Cane-Block",
          cotton: "Cotton Fiber Plot",
          vegetables: "Vegetables & Greens",
          maize: "Maize / Corn",
          custom: "Custom Crop Variety"

        const soilLabels = {
          clay: "Clay Soil (High retention)",
          loamy: "Loamy Soil (Optimal)",
          sandy: "Sandy Loam (Rapid drainage)"
        };

        const newId = `field-${newCrop}-${Date.now().toString(36)}`;
        const newField = {
          id: newId,
          fieldNo: fields.length + 1,
          name: newFieldName.trim() || `Field ${fields.length + 1} · ${cropLabels[newCrop]}`,
          crop: newCrop,
          cropLabel: cropLabels[newCrop] || newCrop,
          soil: newSoil,
          soilLabel: soilLabels[newSoil] || newSoil,
          areaAcres: Number(newAreaAcres),
          areaM2: Math.round(Number(newAreaAcres) * 4046.86),
          method: newMethod,
          flowRateLpm: Number(newFlowRate),
          lat: Number(newLat),
          lng: Number(newLng),
          config: {
            lowT: Number(newLowT),
            highT: Number(newHighT),
            rainBlockPct: Number(newRainBlock),
            maxRunMin: 30,
            mode: "AUTO"
          },
          live: {
            moisture: Math.round((Number(newLowT) + Number(newHighT)) / 2) - 5,
            tempC: 31.0,
            humidity: 65,
            rainSensor: false,
            pumpOn: false,
            pumpRunSeconds: 0,
            lastSeen: Date.now(),
            status: "OFF",
            reason: "Field initialized & calibrated"

        setFields(prev => [...prev, newField]);
        setActiveFieldId(newId);
        setFieldAddedMessage(`Successfully registered ${newField.name}! Switched active telemetry to this plot.`);
        setTimeout(() => {
          setFieldAddedMessage(null);
          setActiveTab("controller");
        }, 1800);
      };

      const handleCropSelect = (crop) => {
        setNewCrop(crop);

        setNewLowT(defaults.lowT);
        setNewHighT(defaults.highT);
      };

      const handleSoilSelect = (soil) => {

        e.preventDefault();
        const city = weatherCity.toLowerCase();

        } else if (city.includes("delhi") || city.includes("punjab")) {

        } else {
          setWeather({ name: `${weatherCity}, Agro-Zone`, temp: 31.4, humidity: 66, wind: 15, pressure: 1012, desc: "PARTLY CLOUDY & CLEAR", rainProb: 20, isRain: false });
        }

      return (

            </div>

            {/* Main Navigation Header */}
            <header className="sticky top-0 z-40 bg-[#FBF6E6]/95 backdrop-blur border-b-2 border-[#16130F] px-4 py-3.5">

                  </span>
                  <div>
                    <div className="font-serif text-2xl font-bold leading-none tracking-tight">AGRICA</div>

                <div className="flex items-center gap-2.5">

                    SIMULATOR ACTIVE

                  <button onClick={() => setIsAlertsOpen(true)} className="p-2.5 rounded-full border-2 border-[#16130F] hover:bg-[#16130F]/5 relative">

                    <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#3E5B34]" />
                  </button>
                  <button onClick={() => { setSelectedField(null); setActiveTab("controller"); }} className="hidden sm:inline-block px-5 py-2.5 rounded-full bg-[#0E0C0B] text-[#FBF6E6] font-mono text-xs uppercase font-bold hover:bg-[#3E5B34] transition-colors shadow">
                    Launch Pump
                  </button>
                </div>
              </div>
            </header>

            {/* Main Canvas Body */}
            <main className="max-w-7xl mx-auto px-4 py-8">
              
              {/* 1. HOME & EDITORIAL OVERVIEW VIEW */}
              {activeTab === "home" && !selectedField && (
                <div className="space-y-10 pb-20 animate-fadeIn">
                  
                  {/* EDITORIAL IN-SITU SPRINKLER & FURROW IRRIGATION PLATE */}
                  <EditorialIrrigationPlate />

                  {/* Headline & Value Statement */}
                  <div className="bg-[#FAF4E2] border-2 border-[#16130F] rounded-3xl p-8 sm:p-12 shadow-sm relative overflow-hidden space-y-6">
                    <div className="absolute -right-12 -bottom-12 w-96 h-auto pointer-events-none opacity-[0.05] select-none">
                      <SprinklerFieldEngraving />
                    </div>
                    <span className="font-mono text-xs uppercase tracking-widest text-[#3E5B34] font-bold px-3 py-1.5 bg-[#FBF6E6] border border-[#16130F]/20 rounded-full inline-block relative z-10">
                      AGRICULTURAL WATER AUTOMATION &bull; REV 2.4
                    </span>
                    <h1 className="font-serif text-4xl sm:text-6xl font-normal leading-tight relative z-10">
                      Every drop, <span className="italic text-[#3E5B34]">where it matters.</span>
                    </h1>
                    <p className="font-sans text-base sm:text-xl text-[#16130F]/85 max-w-3xl leading-relaxed relative z-10">
                      Fixed schedules and guesswork lead to over-watering, crop rot, and wasted electricity. AGRICA reads real-time root-zone moisture, checks weather forecasts, and energizes the pump relay only when the field actually thirsts.
                    </p>
                    <div className="flex flex-wrap gap-4 pt-2 relative z-10">
                      <button onClick={() => setActiveTab("controller")} className="px-8 py-3.5 rounded-full bg-[#0E0C0B] text-[#FBF6E6] font-mono text-sm uppercase font-bold hover:bg-[#3E5B34] transition-all shadow-md">
                        Open Pump Controller →
                      </button>
                      <button onClick={() => setActiveTab("add-field")} className="px-7 py-3.5 rounded-full border-2 border-[#16130F] font-mono text-sm uppercase font-bold hover:bg-[#16130F]/5 transition-all">
                        + Register New Field Plot
                      </button>
                      <button onClick={() => setActiveTab("dashboard")} className="px-7 py-3.5 rounded-full border-2 border-[#16130F] font-mono text-sm uppercase font-bold hover:bg-[#16130F]/5 transition-all">
                        Multi-Field Cockpit ({fields.length} Plots)
                      </button>
                    </div>
                  </div>

                  {/* 4 Value Pillars with Authentic Handcrafted Icons */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    {[
                      { title: "35% – 50% Water Conserved", desc: "Closed-loop hysteresis runs irrigation pumps only when root soil moisture drops below calibrated threshold T.", icon: <IconWaterDrop className="w-8 h-8 text-[#A9C8EC]" /> },
                      { title: "Manual & Auto Relays", desc: "Instant manual override timer plus autonomous closed-loop microcontroller logic.", icon: <IconPumpImpeller className="w-8 h-8 text-[#3E5B34]" /> },
                      { title: "Continuous Soil Telemetry", desc: "Capacitive field probes transmit calibrated VWC percentage at 60s intervals via LoRa mesh.", icon: <IconSoilProbe className="w-8 h-8 text-[#D98B6F]" /> },
                      { title: "Rainfall Avoidance Lockout", desc: "Hyperlocal precipitation forecasts immediately lockout pump cycles to prevent waterlogging.", icon: <IconRainCloud className="w-8 h-8 text-[#9FA9EE]" /> }
                    ].map(p => (
                      <div key={p.title} className="p-6 bg-[#FAF4E2] rounded-3xl border-2 border-[#16130F] shadow-sm space-y-3">
                        <div className="p-2 w-12 h-12 rounded-2xl bg-[#FBF6E6] border border-[#16130F]/20 flex items-center justify-center">
                          {p.icon}

                        <h3 className="font-serif font-bold text-xl">{p.title}</h3>
                        <p className="font-sans text-sm text-[#16130F]/75 leading-relaxed">{p.desc}</p>
                      </div>
                    ))}
                  </div>

                  {/* Operational Modules Navigation Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-[#FAF4E2] border-2 border-[#16130F] rounded-3xl p-8 shadow-sm flex flex-col justify-between space-y-5">
                      <div>
                        <span className="font-mono text-xs uppercase font-bold text-[#A9C8EC] bg-[#16130F] px-2.5 py-1 rounded">ACTUATOR COCKPIT</span>
                        <h3 className="font-serif text-3xl font-bold mt-3">Field & Irrigation Controller</h3>
                        <p className="font-sans text-sm text-[#16130F]/80 mt-2 leading-relaxed">

                        </p>
                      </div>
                      <button onClick={() => setActiveTab("controller")} className="w-full py-3 bg-[#0E0C0B] text-[#FBF6E6] rounded-full font-mono text-xs uppercase font-bold hover:bg-[#3E5B34]">
                        Launch Controller →
                      </button>
                    </div>

                    <div className="bg-[#FAF4E2] border-2 border-[#16130F] rounded-3xl p-8 shadow-sm flex flex-col justify-between space-y-5">
                      <div>
                        <span className="font-mono text-xs uppercase font-bold text-[#3E5B34] bg-[#A8BE86]/40 px-2.5 py-1 rounded">MULTI-PLOT REGISTRY</span>
                        <h3 className="font-serif text-3xl font-bold mt-3">Register & Configure New Plots</h3>
                        <p className="font-sans text-sm text-[#16130F]/80 mt-2 leading-relaxed">
                          Add fields with crop varieties (Paddy, Wheat, Sugarcane, Cotton, Vegetables, Maize), soil texture, plot acreage, irrigation methods, and GPS coordinates.
                        </p>
                      </div>
                      <button onClick={() => setActiveTab("add-field")} className="w-full py-3 bg-[#0E0C0B] text-[#FBF6E6] rounded-full font-mono text-xs uppercase font-bold hover:bg-[#3E5B34]">
                        Register New Field Plot →
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. PUMP CONTROLLER (Prominent Manual vs Auto, Big Fonts, Dial, Terminal) */}
              {activeTab === "controller" && !selectedField && (
                <div className="space-y-8 pb-20 animate-fadeIn">

                        <h2 className="font-serif text-3xl font-bold">{currentUser.name}</h2>
                        <div className="font-mono text-sm text-[#16130F]/70">{currentUser.email}</div>
                        <div className="font-mono text-xs text-[#D98B6F] font-bold">{currentUser.role} &bull; {currentUser.location}</div>
                      </div>

                      <div className="grid grid-cols-2 gap-3 font-mono text-xs text-left bg-[#FBF6E6] p-4 rounded-2xl border border-[#16130F]/20">
                        <div>
                          <span className="text-[#16130F]/60 block uppercase">MANAGED PLOTS:</span>
                          <span className="font-bold text-sm">{fields.length} Fields</span>
                        </div>
                        <div>
                          <span className="text-[#16130F]/60 block uppercase">FARM SIZE:</span>
                          <span className="font-bold text-sm">{currentUser.farmSize || "4.5 Acres"}</span>
                        </div>
                      </div>

                      <div className="flex gap-4">
                        <button
                          onClick={() => setActiveTab("controller")}
                          className="flex-1 py-3 bg-[#0E0C0B] text-[#FBF6E6] rounded-full font-mono text-xs uppercase font-bold hover:bg-[#3E5B34]"
                        >
                          Go to Controller →
                        </button>
                        <button
                          onClick={() => setCurrentUser(null)}
                          className="px-6 py-3 border-2 border-[#D98B6F] text-[#D98B6F] rounded-full font-mono text-xs uppercase font-bold hover:bg-[#D98B6F] hover:text-white"
                        >
                          Sign Out
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-[#FAF4E2] border-2 border-[#16130F] rounded-3xl p-8 sm:p-10 shadow-sm space-y-6 relative overflow-hidden">
                      <div className="absolute -right-10 -bottom-10 w-80 h-auto pointer-events-none opacity-[0.06] select-none">
                        <HarvestGranaryEngraving />
                      </div>
                      <div className="flex border-b-2 border-[#16130F]/20 font-mono text-xs uppercase font-bold relative z-10">
                        <button
                          onClick={() => setAuthMode("login")}
                          className={`flex-1 py-3 text-center border-b-4 transition-all ${authMode === "login" ? "border-[#16130F] text-[#16130F]" : "border-transparent text-[#16130F]/50"}`}
                        >
                          Farmer Sign In
                        </button>
                        <button
                          onClick={() => setAuthMode("signup")}
                          className={`flex-1 py-3 text-center border-b-4 transition-all ${authMode === "signup" ? "border-[#16130F] text-[#16130F]" : "border-transparent text-[#16130F]/50"}`}
                        >
                          New Registration
                        </button>
                      </div>

                      {/* 1-Tap Demo Logins with Engraved Farmer Avatars */}
                      <div className="space-y-3 font-mono text-xs">
                        <span className="text-[10px] text-[#16130F]/60 uppercase font-bold block">ONE-CLICK DEMO FARMER ACCOUNTS:</span>
                        <div className="grid grid-cols-2 gap-3">
                          <button
                            type="button"
                            onClick={() => {
                              setCurrentUser(DEMO_USERS[0]);
                              setActiveTab("controller");
                            }}
                            className="p-3 bg-white border-2 border-[#16130F] rounded-2xl text-left hover:bg-[#A8BE86]/30 transition-all flex items-start gap-2.5"
                          >
                            <IconFarmerAvatar className="w-8 h-8 text-[#3E5B34] flex-shrink-0" gender="male" />
                            <div>
                              <div className="font-bold text-xs">Ramesh Farmer</div>
                              <div className="text-[10px] text-[#16130F]/60">ramesh@agrica.org</div>
                            </div>
                          </button>

                          <button
                            type="button"
                            onClick={() => {
                              setCurrentUser(DEMO_USERS[1]);
                              setActiveTab("controller");
                            }}
                            className="p-3 bg-white border-2 border-[#16130F] rounded-2xl text-left hover:bg-[#A8BE86]/30 transition-all flex items-start gap-2.5"
                          >
                            <IconFarmerAvatar className="w-8 h-8 text-[#D98B6F] flex-shrink-0" gender="female" />
                            <div>
                              <div className="font-bold text-xs">Anita Sharma</div>
                              <div className="text-[10px] text-[#16130F]/60">anita@agrica.org</div>
                            </div>
                          </button>
                        </div>
                      </div>

                      <div className="relative flex items-center justify-center my-2">
                        <div className="border-t border-[#16130F]/20 w-full" />
                        <span className="bg-[#FAF4E2] px-3 font-mono text-[10px] text-[#16130F]/50 uppercase">OR VIA CREDENTIALS</span>
                      </div>

                      <form
                        onSubmit={(e) => {
                          e.preventDefault();
                          const found = DEMO_USERS.find(u => u.email.toLowerCase() === authEmail.toLowerCase());
                          const u = found || {
                            id: `farmer-${Date.now()}`,
                            name: authName.trim() || authEmail.split("@")[0],
                            email: authEmail,
                            role: "Farmer Operator",
                            location: authFarmLocation,
                            gender: "male",
                            farmSize: "3.0 Acres"
                          };
                          setCurrentUser(u);
                          setActiveTab("controller");
                        }}
                        className="space-y-4"
                      >
                        {authMode === "signup" && (
                          <div>
                            <label className="font-mono text-xs uppercase font-bold block mb-1">Full Name:</label>
                            <input
                              type="text"
                              required
                              value={authName}
                              onChange={e => setAuthName(e.target.value)}
                              placeholder="e.g. Ramesh Kumar"
                              className="w-full bg-white border border-[#16130F]/30 rounded-xl p-3 font-mono text-xs"
                            />
                          </div>
                        )}

                        <div>
                          <label className="font-mono text-xs uppercase font-bold block mb-1">Email Address:</label>
                          <input
                            type="email"
                            required
                            value={authEmail}
                            onChange={e => setAuthEmail(e.target.value)}
                            className="w-full bg-white border border-[#16130F]/30 rounded-xl p-3 font-mono text-xs"
                          />
                        </div>

                        <div>
                          <label className="font-mono text-xs uppercase font-bold block mb-1">Password:</label>
                          <input
                            type="password"
                            required
                            value={authPassword}
                            onChange={e => setAuthPassword(e.target.value)}
                            className="w-full bg-white border border-[#16130F]/30 rounded-xl p-3 font-mono text-xs"
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full py-3.5 rounded-full bg-[#0E0C0B] text-[#FBF6E6] font-mono text-xs uppercase font-bold hover:bg-[#3E5B34] transition-colors shadow-lg"
                        >
                          {authMode === "login" ? "Sign In & Connect Telemetry →" : "Register Farmer Account →"}
                        </button>
                      </form>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* Footer */}
          <footer className="border-t-2 border-[#16130F] bg-[#FAF4E2] py-8 px-4 font-mono text-xs text-[#16130F]/70 text-center">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="font-serif text-lg font-bold text-[#16130F]">AGRICA</span>
                <span>&bull; Open Agricultural Precision Telemetry Platform &bull; India</span>
              </div>
              <div className="text-[11px]">
                ESP32 &bull; LoRa 868MHz Mesh &bull; Closed-Loop Hysteresis Engine
              </div>
            </div>
          </footer>

          {/* Mobile Bottom Navigation Bar with Authentic Print Icons */}
          <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#FBF6E6] border-t-2 border-[#16130F] px-2 py-2.5 flex justify-around shadow-lg">
            {[
              { id: "home", label: "Home", icon: <IconFarmstead className="w-5 h-5 mb-0.5" /> },
              { id: "controller", label: "Pump", icon: <IconPumpImpeller className="w-5 h-5 mb-0.5" /> },
              { id: "dashboard", label: "Cockpit", icon: <IconSurveyGrid className="w-5 h-5 mb-0.5" /> },
              { id: "add-field", label: "+Plot", icon: <IconSoilProbe className="w-5 h-5 mb-0.5" /> },
              { id: "weather", label: "Weather", icon: <IconRainCloud className="w-5 h-5 mb-0.5" /> },
              { id: "auth", label: "Account", icon: <IconFarmerAvatar className="w-5 h-5 mb-0.5" gender={currentUser?.gender || "male"} /> }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => { setSelectedField(null); setActiveTab(tab.id); }}
                className={`flex flex-col items-center text-[10px] font-mono uppercase font-bold ${activeTab === tab.id && !selectedField ? "text-[#3E5B34]" : "text-[#16130F]/60"}`}
              >
                {tab.icon}
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* Alerts Drawer Modal */}
          {isAlertsOpen && (
            <div className="fixed inset-0 z-50 bg-[#16130F]/60 flex justify-end">
              <div className="w-full max-w-sm bg-[#FBF6E6] h-full border-l-2 border-[#16130F] p-6 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center border-b-2 border-[#16130F] pb-4 mb-4">
                    <h2 className="font-serif text-2xl font-bold">Alerts & Status</h2>
                    <button onClick={() => setIsAlertsOpen(false)} className="font-mono text-xl font-bold p-1">✕</button>
                  </div>
                  <div className="space-y-4 font-mono text-xs">
                    <div className="p-4 bg-[#FAF4E2] border-2 border-[#3E5B34] rounded-2xl space-y-1">
                      <div className="font-bold text-[#3E5B34] flex items-center gap-1.5">
                        <IconCheckCircle className="w-4 h-4 text-[#3E5B34]" />
                        <span>LoRa Field Mesh Nominal</span>
                      </div>
                      <div className="text-[11px] text-[#16130F]/80">All 3 agricultural plot sensor nodes transmitting at 60s intervals. RSSI -74 dBm.</div>
                    </div>
                    <div className="p-4 bg-[#FAF4E2] border-2 border-[#D98B6F] rounded-2xl space-y-1">
                      <div className="font-bold text-[#D98B6F] flex items-center gap-1.5">
                        <IconWarningTriangle className="w-4 h-4 text-[#D98B6F]" />
                        <span>Field 1 Irrigation Pending</span>
                      </div>
                      <div className="text-[11px] text-[#16130F]/80">Moisture (42%) is below target threshold (60%). Auto-actuator relay is armed.</div>
                    </div>
                  </div>
                </div>
                <button onClick={() => setIsAlertsOpen(false)} className="w-full py-3 bg-[#0E0C0B] text-[#FBF6E6] rounded-full font-mono text-xs uppercase font-bold">
                  Close Alerts
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
